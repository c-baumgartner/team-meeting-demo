name: Terraform deploy template

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  plan:
    if: github.run_number != 1 && github.event.repository.name != 'terraform-iac-forge-af-starter-template'
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    environment:
      name: dev-iac-plan
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      #this is needed since we are running terraform with read-only permissions
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_STATE_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_STATE_RESOURCE_GROUP: ${{ secrets.TFSTATE_RESOURCE_GROUP_NAME }}
      TF_STATE_BLOB_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TF_STATE_BLOB_CONTAINER: ${{ vars.TF_STATE_BLOB_CONTAINER || 'tfstate' }}
      TF_BLOB_FILE: ${{ inputs.tfstate_file ||'terraform.tfstate' }}           
    outputs:
      tfplanExitCode: ${{ steps.tf-plan.outputs.exitcode }}

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4
    # Login to Azure using OIDC
    - uses: Azure/login@v2
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

    # Install the latest version of the Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
        terraform_version: "1.12.1"

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      working-directory: "./iac"
      run: |
        terraform init \
        -backend-config="subscription_id=${{ env.TF_STATE_SUBSCRIPTION_ID }}" \
        -backend-config="resource_group_name=${{ env.TF_STATE_RESOURCE_GROUP }}" \
        -backend-config="storage_account_name=${{ env.TF_STATE_BLOB_ACCOUNT }}" \
        -backend-config="container_name=${{ env.TF_STATE_BLOB_CONTAINER }}" \
        -backend-config="key=${{ env.TF_BLOB_FILE }}"

    # # Checks that all Terraform configuration files adhere to a canonical format
    # # Will fail the build if not
    # - name: Terraform Format
    #   run: terraform fmt -check

    # Generates an execution plan for Terraform
    # An exit code of 0 indicated no changes, 1 a terraform failure, 2 there are pending changes.
    - name: Terraform Plan
      id: tf-plan
      working-directory: "./iac"
      run: |
        export exitcode=0
        terraform plan -detailed-exitcode -no-color -out tfplan || export exitcode=$?

        echo "exitcode=$exitcode" >> $GITHUB_OUTPUT
        
        if [ $exitcode -eq 1 ]; then
          echo Terraform Plan Failed!
          exit 1
        else 
          exit 0
        fi
        
    # Save plan to artifacts  
    - name: Publish Terraform Plan
      uses: actions/upload-artifact@v4
      with:
        name: tfplan
        path: "./iac/tfplan"
        
    # Create string output of Terraform Plan
    - name: Create String Output
      id: tf-plan-string
      working-directory: "./iac"
      run: |
        TERRAFORM_PLAN=$(terraform show -no-color tfplan)
        
        delimiter="$(openssl rand -hex 8)"
        echo "summary<<${delimiter}" >> $GITHUB_OUTPUT
        echo "## Terraform Plan Output" >> $GITHUB_OUTPUT
        echo "<details><summary>Click to expand</summary>" >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo '```terraform' >> $GITHUB_OUTPUT
        echo "$TERRAFORM_PLAN" >> $GITHUB_OUTPUT
        echo '```' >> $GITHUB_OUTPUT
        echo "</details>" >> $GITHUB_OUTPUT
        echo "${delimiter}" >> $GITHUB_OUTPUT
        
    # Publish Terraform Plan as task summary
    - name: Publish Terraform Plan to Task Summary
      env:
        SUMMARY: ${{ steps.tf-plan-string.outputs.summary }}
      run: |
        echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
      
    # If this is a PR post the changes
    - name: Push Terraform Output to PR
      if: github.ref != 'refs/heads/main'
      uses: actions/github-script@v7
      env:
        SUMMARY: "${{ steps.tf-plan-string.outputs.summary }}"
      with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `${process.env.SUMMARY}`;
            github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
            })
  terraform-apply:
    name: 'Terraform Apply'
    if: github.run_number != 1 && github.event.repository.name != 'terraform-iac-forge-af-starter-template' && github.ref == 'refs/heads/main' && needs.plan.outputs.tfplanExitCode == 2
    runs-on: ubuntu-latest
    environment: dev-iac-apply
    needs: [plan]
    permissions:
      id-token: write
      actions: write
      contents: read    
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_USE_OIDC: true
      TF_STATE_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      TF_STATE_RESOURCE_GROUP: ${{ secrets.TFSTATE_RESOURCE_GROUP_NAME }}
      TF_STATE_BLOB_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT_NAME }}
      TF_STATE_BLOB_CONTAINER: ${{ vars.TF_STATE_BLOB_CONTAINER || 'tfstate' }}
      TF_BLOB_FILE: ${{ inputs.tfstate_file ||'terraform.tfstate' }}      
    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Login to Azure using OIDC
    - uses: Azure/login@v2
      with:
        client-id: ${{ env.ARM_CLIENT_ID }}
        tenant-id: ${{ env.ARM_TENANT_ID }}
        subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}      

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false
        terraform_version: "1.12.1"

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      working-directory: "./iac"
      run: |
        terraform init \
        -backend-config="subscription_id=${{ env.TF_STATE_SUBSCRIPTION_ID }}" \
        -backend-config="resource_group_name=${{ env.TF_STATE_RESOURCE_GROUP }}" \
        -backend-config="storage_account_name=${{ env.TF_STATE_BLOB_ACCOUNT }}" \
        -backend-config="container_name=${{ env.TF_STATE_BLOB_CONTAINER }}" \
        -backend-config="key=${{ env.TF_BLOB_FILE }}"

    # Download saved plan from artifacts  
    - name: Download Terraform Plan
      uses: actions/download-artifact@v4
      with:
        name: tfplan
        path: "./iac"

    # Terraform Apply
    - name: Terraform Apply
      working-directory: "./iac"
      run: terraform apply -auto-approve tfplan
